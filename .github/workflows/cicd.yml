name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

stages:
  - code-preparation
  - tests
  - deploy

variables:
  SCRIPTS_DIR: scripts

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          chmod +x $SCRIPTS_DIR/configure-dependencies.sh
          ./$SCRIPTS_DIR/configure-dependencies.sh

      - name: Code formatting
        run: |
          chmod +x $SCRIPTS_DIR/*.sh
          ./$SCRIPTS_DIR/format_code_black.sh

      - name: Code quality check
        run: |
          chmod +x $SCRIPTS_DIR/*.sh
          ./$SCRIPTS_DIR/check_quality_pylint.sh
          ./$SCRIPTS_DIR/check_quality_flake8.sh
          ./$SCRIPTS_DIR/check_quality_ruff.sh

      - name: Unit and functional testing
        run: |
          chmod +x $SCRIPTS_DIR/*.sh
          ./$SCRIPTS_DIR/run_tests.sh

      - name: Tests coverage
        run: |
          chmod +x $SCRIPTS_DIR/*.sh
          ./$SCRIPTS_DIR/run_tests.sh

      - name: Other tests
        run: |
          chmod +x $SCRIPTS_DIR/*.sh
          ./$SCRIPTS_DIR/check_quality_radon.sh
          ./$SCRIPTS_DIR/check_quality_bandit.sh

      - name: Deploy to Heroku
        run: echo "Deploying to Heroku"
