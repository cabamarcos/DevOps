[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["movies", "web_app"]
omit = ["movies/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
